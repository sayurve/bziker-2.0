name: Check Bzikert 2.0

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Install test dependencies
        run: npm ci --ignore-scripts
        working-directory: game
      - name: Run full project regression
        run: python3 tools/check-project.py --full
      - name: Check clean handoff
        run: python3 game/scripts/check-handoff.py
